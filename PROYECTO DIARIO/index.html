<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Productividad HUD</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
      /* --- TEMA FUTURISTA / CYBER --- */
      :root {
        --bg-color: #030406; 
        --panel-bg: rgba(7, 10, 15, 0.75); 
        --accent: #00ffcc; /* Cian Neón */
        --accent-glow: rgba(0, 255, 204, 0.3);
        --accent-2: #8a2be2; /* Púrpura */
        --text-main: #e0f2f1; 
        --text-muted: #6b7c85; 
        --error: #ff2a5f; 
        --warning: #ffb300; 
        --border: rgba(0, 255, 204, 0.15);
        --font-num: 'Courier New', Courier, monospace;
      }
      
      body {
        font-family: 'Inter', 'Segoe UI', sans-serif; 
        background-color: var(--bg-color);
        /* Grid de fondo estilo plano/HUD */
        background-image: 
          linear-gradient(var(--border) 1px, transparent 1px),
          linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 40px 40px;
        background-position: center top;
        color: var(--text-main);
        margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
      }

      header {
        width: 100%; display: flex; justify-content: space-between; align-items: center;
        padding: 15px 40px; box-sizing: border-box; 
        background: rgba(3, 4, 6, 0.9); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100;
        border-bottom: 1px solid var(--border);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
      }

      nav { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
      .nav-btn { 
        background: none; border: 1px solid transparent; color: var(--text-muted); 
        font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
        cursor: pointer; padding: 10px 15px; border-radius: 6px; transition: all 0.3s ease; 
        display: flex; align-items: center; gap: 8px;
      }
      .nav-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .nav-btn:hover { color: var(--accent); border-color: var(--border); background: rgba(0, 255, 204, 0.05); }
      .nav-btn.activo { color: var(--bg-color); background: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
      
      .saludo { text-align: right; line-height: 1.3; } 
      .saludo strong { font-size: 16px; color: var(--accent); font-family: var(--font-num); text-transform: uppercase; } 
      .saludo span { font-size: 12px; color: var(--text-muted); }
      
      #pantalla-auth { display: flex; justify-content: center; align-items: center; height: 100vh; width: 100%; }
      #app-principal { display: none; width: 100%; flex-direction: column; align-items: center; }
      .pestana { display: none; width: 95%; max-width: 1100px; margin-top: 30px; flex-direction: column; gap: 20px; animation: glitchFade 0.4s ease; padding-bottom: 50px;}
      .pestana.activa { display: flex; }
      @keyframes glitchFade { 
        0% { opacity: 0; transform: translateY(10px) scale(0.98); filter: hue-rotate(90deg); } 
        100% { opacity: 1; transform: translateY(0) scale(1); filter: hue-rotate(0deg); } 
      }

      /* PANELES ESTILO HUD */
      .panel { 
        background: var(--panel-bg); padding: 25px; border-radius: 12px; 
        border: 1px solid var(--border); position: relative; 
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0,255,204,0.02);
        backdrop-filter: blur(10px);
      }
      /* Esquinas Sci-Fi */
      .panel::before {
        content: ''; position: absolute; top: -1px; left: -1px; width: 20px; height: 20px;
        border-top: 2px solid var(--accent); border-left: 2px solid var(--accent);
        border-top-left-radius: 12px;
      }
      .panel::after {
        content: ''; position: absolute; bottom: -1px; right: -1px; width: 20px; height: 20px;
        border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent);
        border-bottom-right-radius: 12px;
      }

      .panel h3 { margin-top: 0; font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
      .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
      .dash-grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
      
      @media(max-width: 800px) { .dash-grid-2 { grid-template-columns: 1fr; } .saludo {display:none;} }
      @media(max-width: 600px) {
        header { padding: 10px 12px; } nav { gap: 4px; }
        .nav-btn { padding: 8px 9px; font-size: 11px; } .nav-btn svg { width: 14px; height: 14px; }
      }

      /* NÚMEROS ESTILO TERMINAL */
      .numero-gigante { font-size: 46px; font-weight: bold; font-family: var(--font-num); color: white; margin: 5px 0; text-shadow: 0 0 15px rgba(255,255,255,0.2); }
      .texto-pequeno { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;}
      
      .barra-progreso { width: 100%; height: 6px; background: rgba(0,255,204,0.1); border-radius: 3px; margin-top: 15px; overflow: hidden; }
      .progreso-fill { height: 100%; background: var(--accent); transition: width 0.5s; box-shadow: 0 0 10px var(--accent); }

      .grafico-balance-container { position: relative; width: 150px; height: 150px; margin: 0 auto; }
      .balance-texto-centro { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
      .leyenda-balance { margin-top: 15px; font-size: 12px; display: flex; flex-direction: column; gap: 8px; font-family: var(--font-num); }
      
      /* --- CALENDARIO MENSUAL FUTURISTA --- */
      .calendario-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
      .dia-cal { 
        aspect-ratio: 1; border-radius: 6px; background: rgba(255,255,255,0.03); 
        display: flex; align-items: center; justify-content: center; 
        font-size: 12px; font-family: var(--font-num); color: var(--text-muted); 
        cursor: help; transition: 0.3s; border: 1px solid transparent;
      }
      .dia-cal:hover:not(:empty) { transform: scale(1.1); z-index: 10; box-shadow: 0 0 15px var(--accent-glow); border-color: var(--accent); color: white;}
      .dia-cal.int-3 { background: rgba(0, 255, 204, 0.9); color: #000; font-weight: bold; box-shadow: 0 0 10px var(--accent-glow); }
      .dia-cal.int-2 { background: rgba(0, 255, 204, 0.4); color: #fff; border-color: rgba(0,255,204,0.5); }
      .dia-cal.int-1 { background: rgba(0, 255, 204, 0.1); color: #fff; border-color: rgba(0,255,204,0.2); }
      .dia-cal.neg { background: rgba(255, 42, 95, 0.2); color: var(--error); border-color: rgba(255,42,95,0.3); }
      .dia-hoy { border: 1px solid var(--accent) !important; color: white; text-shadow: 0 0 5px var(--accent); }

      /* INPUTS Y BOTONES */
      textarea, input[type="text"], input[type="email"], input[type="password"] { 
          background: rgba(0,0,0,0.5); color: var(--accent); border: 1px solid var(--border); 
          border-radius: 8px; padding: 20px; font-size: 15px; font-family: var(--font-num); width: 100%; box-sizing: border-box; 
          transition: 0.3s;
      }
      textarea { min-height: 140px; resize: vertical; }
      textarea::placeholder { color: var(--text-muted); font-family: 'Inter', sans-serif; }
      textarea:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: inset 0 0 10px var(--accent-glow); background: rgba(0,255,204,0.02); }
      
      button.btn-principal { 
        background: var(--accent); color: #000; border: none; padding: 15px; 
        font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px;
        border-radius: 8px; cursor: pointer; width: 100%; transition: all 0.3s ease; 
        display: flex; justify-content: center; align-items: center; gap: 10px;
        box-shadow: 0 0 15px var(--accent-glow);
        animation: pulseBtn 2s infinite;
      }
      @keyframes pulseBtn { 0% { box-shadow: 0 0 10px var(--accent-glow); } 50% { box-shadow: 0 0 25px rgba(0,255,204,0.6); } 100% { box-shadow: 0 0 10px var(--accent-glow); } }
      button.btn-principal:hover:not(:disabled) { transform: translateY(-2px); background: white; }
      button.btn-principal:disabled { background: #222; color: #555; cursor: not-allowed; animation: none; box-shadow: none; border: 1px solid #444; }

      #diario-zona-resultado { display: none; animation: fade 0.5s ease; flex-direction: column; gap: 15px; }
      .stats-ia-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
      .stat-ia-box { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 8px; border: 1px solid var(--border); display: flex; justify-content: space-between; font-family: var(--font-num); }
      .stat-ia-box span { color: var(--accent); font-weight:bold; }
      .insight-box { background: rgba(0, 255, 204, 0.05); border-left: 4px solid var(--accent); padding: 15px; border-radius: 8px; font-style: italic; color: #ddd; line-height: 1.5; }

      .auth-card { background: var(--panel-bg); padding: 30px; border-radius: 12px; text-align: center; width: 90%; max-width: 400px; border: 1px solid var(--border); }
      .btn-auth { padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; transition: 0.2s; text-transform: uppercase; font-size:12px; letter-spacing:1px;}
      
      .tarea-item { display:flex; justify-content:space-between; background:rgba(0,0,0,0.4); padding:15px; border-radius:8px; align-items:center; border: 1px solid var(--border); transition: 0.2s;}
      .tarea-item:hover { background: rgba(0,255,204,0.05); border-color: var(--accent); }
      .check-box { width:20px; height:20px; border-radius:4px; border:2px solid var(--accent); display:flex; align-items:center; justify-content:center; color:black; font-weight:bold; font-size:14px; transition: 0.2s; }
      
      .filtro-historial { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;}
      .btn-filtro { background: rgba(0,0,0,0.5); color: var(--text-muted); border: 1px solid var(--border); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 11px; text-transform: uppercase; letter-spacing:1px; transition: 0.2s; }
      .btn-filtro.activo { background: var(--accent); color: black; border-color: var(--accent); font-weight: bold; box-shadow: 0 0 10px var(--accent-glow); }
      
      .lista-historial { display: flex; flex-direction: column; gap: 15px; }
      .item-historial { background: rgba(0,0,0,0.4); padding: 20px; border-left: 3px solid gray; border-radius: 8px; border: 1px solid var(--border); transition: 0.2s; }
      .item-historial:hover { transform: translateX(5px); border-color: rgba(0,255,204,0.3); background:rgba(0,255,204,0.02); }
      .item-historial.POSITIVO { border-left-color: var(--accent); }
      .item-historial.NEGATIVO { border-left-color: var(--error); }
      .item-historial.NEUTRO { border-left-color: var(--warning); }
    </style>
</head>
<body>

  <!-- AUTENTICACIÓN HUD -->
  <div id="pantalla-auth">
    <div class="auth-card">
      <h2 style="color:var(--accent); margin-top:0; font-family:var(--font-num); text-transform:uppercase; letter-spacing:3px;">SYSTEM.LOGIN</h2>
      <input type="email" id="auth-email" placeholder="ID de Usuario (Email)" style="margin-bottom:10px;">
      <input type="password" id="auth-password" placeholder="Clave de acceso" style="margin-bottom:15px;">
      
      <div style="display: flex; gap:10px; margin-bottom:15px;">
        <button class="btn-auth" style="background:var(--accent); color:black; box-shadow: 0 0 10px var(--accent-glow);" onclick="loginEmail()">Entrar</button>
        <button class="btn-auth" style="background:transparent; color:white; border:1px solid var(--border);" onclick="registrarEmail()">Crear</button>
      </div>
      
      <button class="btn-auth" style="background:white; color:black;" onclick="loginGoogle()">Conectar Google G-Link</button>
      
      <div style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed var(--border);">
        <button class="btn-auth" style="background:transparent; color:var(--text-muted); border:1px solid #333;" onclick="loginInvitado()">Acceso Modo Invitado</button>
      </div>
      <p id="auth-error" style="color: var(--error); font-size: 12px; margin-top:15px; font-family:var(--font-num);"></p>
    </div>
  </div>

  <div id="app-principal">
    <header>
      <nav>
        <button class="nav-btn activo" onclick="cambiarPestana('diario', this)"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Diario</button>
        <button class="nav-btn" onclick="cambiarPestana('tareas', this)"><svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> Tareas</button>
        <button class="nav-btn" onclick="cambiarPestana('panel', this)"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> Panel</button>
        <button class="nav-btn" onclick="cambiarPestana('historial', this)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Historial</button>
        <button class="nav-btn" onclick="cerrarSesion()" style="color: var(--error);"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Salir</button>
      </nav>
      <div class="saludo"><strong>USER.<span id="nombre-usuario">AXEL</span></strong><br><span>Estado: Online</span></div>
    </header>

    <div id="diario" class="pestana activa">
      <div class="panel" style="max-width: 700px; margin: 0 auto; width: 100%;">
        <div style="text-align: center; margin-bottom: 25px;">
          <div id="fecha-diario" style="color: var(--accent); font-family:var(--font-num); font-weight: bold; text-transform: uppercase; font-size: 12px; margin-bottom: 5px;"></div>
          <h2 style="margin: 0; color: white; font-size: 22px; font-weight:300; letter-spacing:1px;">NUEVO REGISTRO</h2>
        </div>
        <div id="diario-zona-input">
          <textarea id="texto-diario" maxlength="2000" oninput="actualizarContador()" placeholder="> Inicializando log diario. Reporta progreso, enfoque y disciplina..."></textarea>
          <div style="display: flex; justify-content: flex-end; margin-top: 8px; margin-bottom: 20px;"><span id="contador-chars" class="texto-pequeno">0 / 2000 B</span></div>
          <button id="btn-guardar" class="btn-principal" onclick="analizarYGuardar()">[ EJECUTAR ANÁLISIS IA ]</button>
          <p id="error-ia" style="color:var(--error); text-align:center; font-size:12px; font-family:var(--font-num); margin-top:10px;"></p>
        </div>
        <div id="diario-zona-resultado">
          <h2 style="color:white; text-align:center; margin-top:0; font-family:var(--font-num);">[ NOTA: <span id="ia-puntuacion-global" style="color:var(--accent);">0.0</span>/10 ]</h2>
          <div class="stats-ia-grid">
            <div class="stat-ia-box">DISCIPLINA <span id="ia-disciplina"></span></div>
            <div class="stat-ia-box">ENFOQUE <span id="ia-enfoque"></span></div>
            <div class="stat-ia-box">CONSTANCIA <span id="ia-constancia"></span></div>
            <div class="stat-ia-box">ESTADO <span id="ia-estado" style="color:white;"></span></div>
          </div>
          <div class="insight-box"><span style="color:var(--accent)">> SYS.INSIGHT:</span> <span id="ia-insight"></span></div>
          <button class="btn-principal" style="animation:none;" onclick="irAlPanelDesdeResultado()">VER DASHBOARD</button>
        </div>
      </div>
    </div>

    <div id="tareas" class="pestana">
      <div class="panel" style="max-width: 700px; margin: 0 auto; width: 100%;">
        <h3>PROTOCOLO DE TAREAS</h3>
        <div style="display:flex; gap:10px; margin-bottom:25px;">
           <input type="text" id="input-tarea" placeholder="> Insertar nueva tarea..." onkeypress="if(event.key === 'Enter') agregarTarea()">
           <button onclick="agregarTarea()" style="background:var(--accent); color:black; border:none; border-radius:8px; padding:0 25px; font-weight:bold; font-size:24px; cursor:pointer;">+</button>
        </div>
        <div id="lista-tareas" style="display:flex; flex-direction:column; gap:12px;"></div>
      </div>
    </div>

    <div id="panel" class="pestana">
      <div class="dash-grid">
        <div class="panel">
          <h3>RACHA ACTUAL</h3>
          <div id="racha-numero" class="numero-gigante" style="color: var(--text-muted);">0</div>
          <div id="racha-estado" class="texto-pequeno">INACTIVO</div>
          <div style="margin-top: 15px; border-top: 1px dashed var(--border); padding-top: 10px;">
             <div class="texto-pequeno">RÉCORD: <span id="racha-maxima" style="color:white;">0</span></div>
          </div>
        </div>
        <div class="panel">
          <h3>TAREAS COMPLETADAS</h3>
          <div id="tareas-completadas" class="numero-gigante" style="color: white;">0/0</div>
          <div class="texto-pequeno">HOY</div>
          <div class="barra-progreso"><div id="barra-tareas" class="progreso-fill" style="width: 0%;"></div></div>
        </div>
        <div class="panel">
          <h3>BALANCE GLOBAL</h3>
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <div class="grafico-balance-container">
              <canvas id="miGrafica"></canvas>
              <div class="balance-texto-centro"><div style="font-size: 10px; color: var(--text-muted); font-weight: bold; font-family:var(--font-num);">WIN RATE</div><div id="balance-ganador" style="font-size: 18px; font-family:var(--font-num); color: white; font-weight: bold; text-shadow:0 0 10px white;">0%</div></div>
            </div>
            <div class="leyenda-balance" id="leyenda-balance"></div>
          </div>
        </div>
      </div>
      <div class="dash-grid-2">
        <div class="panel">
          <h3>TELEMETRÍA (7 DÍAS)</h3>
          <div id="canvas-evolucion" style="height: 250px; width: 100%;"><canvas id="graficaEvolucion"></canvas></div>
        </div>
        <div class="panel">
          <h3 id="titulo-calendario">CALENDARIO</h3>
          <div class="calendario-grid" id="calendario-grid"></div>
        </div>
      </div>
    </div>

    <div id="historial" class="pestana">
      <div class="panel">
        <div class="filtro-historial">
          <button class="btn-filtro activo" onclick="aplicarFiltro('ALL', this)">DATA.ALL</button>
          <button class="btn-filtro" onclick="aplicarFiltro('POSITIVO', this)">DATA.POS</button>
          <button class="btn-filtro" onclick="aplicarFiltro('NEUTRO', this)">DATA.NEU</button>
          <button class="btn-filtro" onclick="aplicarFiltro('NEGATIVO', this)">DATA.NEG</button>
        </div>
        <div id="lista-historial" class="lista-historial"></div>
      </div>
    </div>
  </div>

  <script>
    // --- PREVENCIÓN XSS ---
    function esc(str) { if(!str) return ""; const div = document.createElement('div'); div.appendChild(document.createTextNode(str)); return div.innerHTML; }

    // --- CORRECCIÓN FECHA LOCAL (IGNORAR UTC) ---
    function getHoyISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    
    // --- FIREBASE SETUP ---
    const firebaseConfig = {
      apiKey: "AIzaSyAfzGeUy1uI98YrDpFUrQbSWDN1ag9IrJA",
      authDomain: "diario-inteligente-d329b.firebaseapp.com",
      projectId: "diario-inteligente-d329b",
      storageBucket: "diario-inteligente-d329b.firebasestorage.app"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(); const db = firebase.firestore();
    
    // API KEY TEMPORAL EN FRONTEND (Próximo paso: Netlify Backend)
    const GEMINI_API_KEY = 'AQ.Ab8RN6LOhA4s1Dlsrj7qzb2MNdcYM6BAiZXTTPM2fEsKehQemg';

    let usuarioActual = null; let chartDonut = null; let chartLine = null; 
    let misTareasDeHoy = []; let historialGlobal = []; 

    // Configuración Inicial UI
    document.getElementById('fecha-diario').textContent = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
    
    function actualizarContador() { 
        const val = document.getElementById('texto-diario').value.length;
        const el = document.getElementById('contador-chars');
        el.textContent = `${val} / 2000 B`;
        if (val >= 1850) { el.style.color = "var(--error)"; el.style.textShadow = "0 0 10px var(--error)"; }
        else { el.style.color = "var(--text-muted)"; el.style.textShadow = "none"; }
    }

    function cambiarPestana(id, btn) { document.querySelectorAll('.pestana').forEach(p => p.classList.remove('activa')); document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('activo')); document.getElementById(id).classList.add('activa'); if(btn) btn.classList.add('activo'); }

    // --- AUTH ---
    auth.onAuthStateChanged((user) => {
      if (user) { 
        usuarioActual = user; 
        document.getElementById('pantalla-auth').style.display = 'none'; 
        document.getElementById('app-principal').style.display = 'flex'; 
        let nombreDisplay = user.isAnonymous ? "GUEST" : (user.displayName ? user.displayName.split(' ')[0] : "ADMIN");
        document.getElementById('nombre-usuario').textContent = esc(nombreDisplay).toUpperCase();
        cargarDatosNube(); cargarTareasNube();
      } else { 
        usuarioActual = null; document.getElementById('app-principal').style.display = 'none'; document.getElementById('pantalla-auth').style.display = 'flex'; 
      }
    });

    const getEl = (id) => document.getElementById(id).value;
    const showErr = (msg) => document.getElementById('auth-error').textContent = "ERROR: " + msg;
    
    async function loginEmail() { try { await auth.signInWithEmailAndPassword(getEl('auth-email'), getEl('auth-password')); } catch (e) { showErr(e.message); } }
    async function registrarEmail() { try { await auth.createUserWithEmailAndPassword(getEl('auth-email'), getEl('auth-password')); } catch (e) { showErr(e.message); } }
    async function loginGoogle() { try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); } catch (e) { showErr(e.message); } }
    async function loginInvitado() { try { await auth.signInAnonymously(); } catch (e) { showErr(e.message); } }
    function cerrarSesion() { auth.signOut(); }

    // --- TAREAS ---
    async function cargarTareasNube() {
      if(!usuarioActual) return;
      const hoyISO = getHoyISO();
      const snapshot = await db.collection('usuarios').doc(usuarioActual.uid).collection('tareas').where('fechaISO', '==', hoyISO).get();
      misTareasDeHoy = []; snapshot.forEach(doc => misTareasDeHoy.push({ id: doc.id, ...doc.data() }));
      renderTareas();
    }
    
    async function agregarTarea() {
      const input = document.getElementById('input-tarea'); const texto = input.value.trim(); if(!texto) return;
      const nueva = { texto, completada: false, fechaISO: getHoyISO(), timestamp: Date.now() };
      const docRef = await db.collection('usuarios').doc(usuarioActual.uid).collection('tareas').add(nueva);
      misTareasDeHoy.push({ id: docRef.id, ...nueva }); input.value = ""; renderTareas();
    }
    
    async function toggleTarea(id) {
      const tarea = misTareasDeHoy.find(t => t.id === id); if(!tarea) return;
      tarea.completada = !tarea.completada; renderTareas();
      await db.collection('usuarios').doc(usuarioActual.uid).collection('tareas').doc(id).update({ completada: tarea.completada });
    }
    
    async function eliminarTarea(id) {
      misTareasDeHoy = misTareasDeHoy.filter(t => t.id !== id); renderTareas();
      await db.collection('usuarios').doc(usuarioActual.uid).collection('tareas').doc(id).delete();
    }
    
    function renderTareas() {
      const lista = document.getElementById('lista-tareas'); lista.innerHTML = ""; let completadas = 0;
      misTareasDeHoy.forEach(t => {
        if(t.completada) completadas++;
        const txtSeguro = esc(t.texto);
        lista.innerHTML += `
          <div class="tarea-item">
            <div style="display:flex; gap:15px; align-items:center; cursor:pointer; flex:1;" onclick="toggleTarea('${t.id}')">
              <div class="check-box" style="background:${t.completada ? 'var(--accent)' : 'transparent'}; box-shadow:${t.completada ? '0 0 10px var(--accent)' : 'none'}; border-color:${t.completada ? 'var(--accent)' : 'var(--text-muted)'}">${t.completada ? '✓' : ''}</div>
              <span style="${t.completada ? 'text-decoration:line-through; color:var(--text-muted);' : 'color:var(--accent); font-family:var(--font-num); font-weight:bold;'}">> ${txtSeguro}</span>
            </div>
            <button onclick="eliminarTarea('${t.id}')" style="background:none; border:none; color:var(--error); cursor:pointer; font-size:16px;">✕</button>
          </div>`;
      });
      const total = misTareasDeHoy.length;
      document.getElementById('tareas-completadas').textContent = `${completadas}/${total}`;
      document.getElementById('tareas-completadas').style.color = (total > 0 && completadas === total) ? "var(--accent)" : "white";
      document.getElementById('barra-tareas').style.width = total === 0 ? "0%" : `${(completadas/total)*100}%`;
    }

    // --- CEREBRO IA ---
    async function analizarYGuardar() {
      const texto = document.getElementById('texto-diario').value;
      const btn = document.getElementById('btn-guardar');
      const errEl = document.getElementById('error-ia');
      if (!texto.trim()) return;

      btn.disabled = true; btn.innerHTML = "PROCESANDO DATOS..."; errEl.textContent = "";

      const tareasTXT = misTareasDeHoy.map(t => (t.completada ? '☑ ' : '☐ ') + t.texto).join('\n');
      const prompt = `Analiza la disciplina cruzando el diario CON la lista de tareas.
Tareas de hoy:
${tareasTXT || 'Ninguna tarea registrada.'}
Diario: "${texto}"
Devuelve ÚNICAMENTE un JSON válido: {"veredicto":"POSITIVO|NEGATIVO|NEUTRO","estado":"SÓLIDO","disciplina":8,"enfoque":7,"constancia":9,"insight":"Frase corta"}`;

      try {
        const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error.message);

        let textoRaw = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
        const iaData = JSON.parse(textoRaw);
        const v = iaData.veredicto; if (!['POSITIVO','NEGATIVO','NEUTRO'].includes(v)) throw new Error("Veredicto inválido");
        
        const clamp = (num) => Math.min(Math.max(parseInt(num) || 5, 1), 10);
        const d = clamp(iaData.disciplina), e = clamp(iaData.enfoque), c = clamp(iaData.constancia);
        const globalScore = parseFloat(((d + e + c) / 3).toFixed(1));

        const nuevaEntrada = {
          fechaISO: getHoyISO(),
          fechaDisplay: new Date().toLocaleDateString('es-ES', {day:'numeric', month:'short'}),
          timestamp: Date.now(), 
          veredicto: v, textoOriginal: texto, estado: (iaData.estado || "NEUTRO").toUpperCase().replace(/[^A-ZÁÉÍÓÚÑ ]/g, ''), // Quitamos emojis para estética HUD
          disciplina: d, enfoque: e, constancia: c, puntuacionGlobal: globalScore,
          insight: (iaData.insight || "Sigue así.").toUpperCase()
        };

        await db.collection('usuarios').doc(usuarioActual.uid).collection('entradas').add(nuevaEntrada);

        document.getElementById('ia-estado').textContent = esc(nuevaEntrada.estado);
        document.getElementById('ia-disciplina').textContent = d;
        document.getElementById('ia-enfoque').textContent = e;
        document.getElementById('ia-constancia').textContent = c;
        document.getElementById('ia-puntuacion-global').textContent = globalScore;
        document.getElementById('ia-insight').textContent = esc(nuevaEntrada.insight);
        
        document.getElementById('diario-zona-input').style.display = 'none';
        document.getElementById('diario-zona-resultado').style.display = 'flex';
        document.getElementById('texto-diario').value = "";
        actualizarContador(); cargarDatosNube();

      } catch (err) { 
        errEl.textContent = "SYS.ERROR: CONEXIÓN IA RECHAZADA."; btn.disabled = false; btn.innerHTML = "[ REINTENTAR ANÁLISIS ]";
      }
    }

    function irAlPanelDesdeResultado() {
        document.getElementById('diario-zona-resultado').style.display = 'none';
        document.getElementById('diario-zona-input').style.display = 'block';
        document.getElementById('btn-guardar').innerHTML = "[ EJECUTAR ANÁLISIS IA ]";
        document.getElementById('btn-guardar').disabled = false;
        cambiarPestana('panel', document.querySelectorAll('.nav-btn')[2]);
    }

    // --- CARGA GLOBAL ---
    async function cargarDatosNube() {
      if (!usuarioActual) return;
      const snapshot = await db.collection('usuarios').doc(usuarioActual.uid).collection('entradas').orderBy('timestamp', 'desc').get();
      historialGlobal = []; snapshot.forEach(doc => historialGlobal.push(doc.data()));

      renderHistorial(historialGlobal); 
      calcularRachasPorDiasReales(historialGlobal); 
      renderGraficaBalance(historialGlobal); 
      renderEvolucionEstricta7Dias(historialGlobal); 
      renderCalendarioMesActual(historialGlobal); // NUEVO MOTOR CALENDARIO
    }

    function aplicarFiltro(tipo, btn) {
      document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('activo')); btn.classList.add('activo');
      if(tipo === 'ALL') renderHistorial(historialGlobal); else renderHistorial(historialGlobal.filter(d => d.veredicto === tipo));
    }

    function renderHistorial(entradas) {
      const cont = document.getElementById('lista-historial'); cont.innerHTML = "";
      if(entradas.length === 0) { cont.innerHTML = '<p class="texto-pequeno">NO DATA FOUND.</p>'; return; }
      entradas.forEach(d => {
        let statsHtml = d.disciplina ? `<div style="display:flex; gap:15px; margin-top:10px; font-family:var(--font-num); font-size:12px; color:var(--accent);"><span>DIS:${d.disciplina}</span><span>ENF:${d.enfoque}</span><span>CON:${d.constancia}</span></div><div style="margin-top:10px; font-style:italic; color:#aaa; font-size:12px; border-left:2px solid var(--accent); padding-left:10px;">> ${esc(d.insight)}</div>` : '';
        let dot = d.veredicto === "POSITIVO" ? "var(--accent)" : (d.veredicto === "NEGATIVO" ? "var(--error)" : "var(--warning)");
        cont.innerHTML += `<div class="item-historial ${d.veredicto}">
          <div style="display:flex; justify-content:space-between; margin-bottom:10px; align-items:center;">
            <div class="texto-pequeno" style="font-weight:bold; color:white; display:flex; align-items:center; gap:5px;"><div style="width:8px; height:8px; border-radius:50%; background:${dot}; box-shadow:0 0 5px ${dot}"></div> ${esc(d.fechaDisplay)}</div>
            <span style="background:rgba(255,255,255,0.05); border:1px solid var(--border); padding:3px 8px; border-radius:4px; font-family:var(--font-num); font-size:12px; color:var(--accent)">SCORE: ${d.puntuacionGlobal || '-'}</span>
          </div>
          <div style="font-size:14px; line-height:1.6; color:#ccc; font-family:var(--font-num);">"${esc(d.textoOriginal)}"</div>
          ${statsHtml}
        </div>`;
      });
    }

    function calcularRachasPorDiasReales(entradas) {
      let mapaDias = {};
      entradas.forEach(e => { if (!mapaDias[e.fechaISO] || e.veredicto === 'POSITIVO') mapaDias[e.fechaISO] = e.veredicto; });
      let fechasUnicas = Object.keys(mapaDias).sort((a,b) => new Date(b) - new Date(a));
      
      let rachaActual = 0; let hoy = getHoyISO();
      let ayer = new Date(); ayer.setDate(ayer.getDate() - 1); let ayerISO = ayer.toISOString().split('T')[0];
      
      let fechaAComprobar = fechasUnicas.includes(hoy) ? hoy : ayerISO;
      let refDate = new Date(fechaAComprobar);
      
      for(let f of fechasUnicas) {
         if (f === fechaAComprobar && mapaDias[f] === 'POSITIVO') {
             rachaActual++; refDate.setDate(refDate.getDate() - 1);
             fechaAComprobar = refDate.toISOString().split('T')[0];
         } else break;
      }

      let mejorRacha = 0; let tempRacha = 0; let tempPrevio = null;
      fechasUnicas.slice().reverse().forEach(f => {
         if(mapaDias[f] === 'POSITIVO') {
             if(!tempPrevio) { tempRacha = 1; tempPrevio = new Date(f); }
             else {
                 let expected = new Date(tempPrevio); expected.setDate(expected.getDate() + 1);
                 if(f === expected.toISOString().split('T')[0]) tempRacha++;
                 else tempRacha = 1;
                 tempPrevio = new Date(f);
             }
             if(tempRacha > mejorRacha) mejorRacha = tempRacha;
         } else { tempRacha = 0; tempPrevio = null; }
      });

      document.getElementById('racha-numero').textContent = rachaActual;
      document.getElementById('racha-numero').style.color = rachaActual > 0 ? "var(--accent)" : "white";
      document.getElementById('racha-numero').style.textShadow = rachaActual > 0 ? "0 0 15px var(--accent-glow)" : "none";
      document.getElementById('racha-estado').textContent = rachaActual > 0 ? "ACTIVO" : "INACTIVO";
      document.getElementById('racha-estado').style.color = rachaActual > 0 ? "var(--accent)" : "var(--text-muted)";
      document.getElementById('racha-maxima').textContent = mejorRacha;
    }

    function renderGraficaBalance(entradas) {
      let pos = 0, neg = 0, neu = 0;
      entradas.forEach(d => { if(d.veredicto==="POSITIVO") pos++; else if(d.veredicto==="NEGATIVO") neg++; else neu++; });
      const total = pos + neg + neu; const pctPos = total === 0 ? 0 : Math.round((pos/total)*100);
      document.getElementById('balance-ganador').textContent = `${pctPos}%`;
      document.getElementById('leyenda-balance').innerHTML = `<div style="color:var(--accent)">POS: ${pos}</div><div style="color:var(--error)">NEG: ${neg}</div><div style="color:var(--warning)">NEU: ${neu}</div>`;
      if (chartDonut) chartDonut.destroy();
      chartDonut = new Chart(document.getElementById('miGrafica').getContext('2d'), { type: 'doughnut', data: { datasets: [{ data: [pos, neg, neu], backgroundColor: ['#00ffcc', '#ff2a5f', '#ffb300'], borderWidth: 0, hoverOffset: 4 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '80%', plugins: { tooltip: { enabled: false } } } });
    }

    function renderEvolucionEstricta7Dias(entradas) {
      let mapaDias = {};
      entradas.forEach(e => { if(!mapaDias[e.fechaISO]) mapaDias[e.fechaISO] = e; });

      const labels = []; const dataD = []; const dataE = []; const dataC = [];
      const diasNombres = ['DOM','LUN','MAR','MIE','JUE','VIE','SAB'];

      for(let i=6; i>=0; i--) {
        let tempD = new Date(); tempD.setDate(tempD.getDate() - i);
        let iso = `${tempD.getFullYear()}-${String(tempD.getMonth() + 1).padStart(2, '0')}-${String(tempD.getDate()).padStart(2, '0')}`;
        labels.push(diasNombres[tempD.getDay()]);
        
        if(mapaDias[iso]) {
          dataD.push(mapaDias[iso].disciplina); dataE.push(mapaDias[iso].enfoque); dataC.push(mapaDias[iso].constancia);
        } else {
          dataD.push(null); dataE.push(null); dataC.push(null);
        }
      }

      Chart.defaults.color = '#6b7c85';
      Chart.defaults.font.family = "'Courier New', Courier, monospace";
      if (chartLine) chartLine.destroy();
      chartLine = new Chart(document.getElementById('graficaEvolucion').getContext('2d'), {
        type: 'line', data: { 
          labels: labels, 
          datasets: [
            { label: 'DIS', data: dataD, borderColor: '#00ffcc', backgroundColor: 'rgba(0,255,204,0.1)', borderWidth: 2, tension: 0.3, pointBackgroundColor: '#00ffcc', pointRadius:4, pointHoverRadius:6 },
            { label: 'ENF', data: dataE, borderColor: '#8a2be2', backgroundColor: 'transparent', borderWidth: 2, tension: 0.3, borderDash: [5, 5], pointRadius:0 },
            { label: 'CON', data: dataC, borderColor: '#ffb300', backgroundColor: 'transparent', borderWidth: 2, tension: 0.3, borderDash: [2, 2], pointRadius:0 }
          ] 
        },
        options: { responsive: true, maintainAspectRatio: false, spanGaps: false, plugins: { legend: { display: true, position: 'bottom', labels:{color:'#e0f2f1'}} }, scales: { y: { min: 0, max: 10, grid: { color: 'rgba(0,255,204,0.05)' } }, x: { grid: { display: false } } } }
      });
    }

    // --- NUEVO MOTOR DE CALENDARIO MENSUAL HUD ---
    function renderCalendarioMesActual(entradas) {
      const grid = document.getElementById('calendario-grid'); grid.innerHTML = "";
      const titulo = document.getElementById('titulo-calendario');

      const hoy = new Date();
      const año = hoy.getFullYear(); const mes = hoy.getMonth();
      const mesesNom = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
      
      titulo.innerHTML = `CALENDARIO [ ${mesesNom[mes]} ${año} ]`;

      let mapa = {}; entradas.forEach(d => { if(!mapa[d.fechaISO]) mapa[d.fechaISO] = d; });

      // Cabeceras días
      ['L','M','X','J','V','S','D'].forEach(d => {
          grid.innerHTML += `<div style="text-align:center; font-size:10px; color:var(--text-muted); font-family:var(--font-num); font-weight:bold; margin-bottom:5px;">${d}</div>`;
      });

      let primerDia = new Date(año, mes, 1).getDay();
      primerDia = primerDia === 0 ? 6 : primerDia - 1; // Ajuste para que Lunes sea 0
      const diasEnMes = new Date(año, mes + 1, 0).getDate();

      // Rellenar huecos vacíos del inicio del mes
      for(let i=0; i<primerDia; i++) grid.innerHTML += `<div></div>`;

      const hoyISOReal = getHoyISO();

      // Renderizar los días reales del mes
      for(let i=1; i<=diasEnMes; i++) {
        const diaISO = `${año}-${String(mes+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
        let d = mapa[diaISO];
        let clase = ""; let title = "NO DATA";
        
        if(d) {
            title = `SCORE: ${d.puntuacionGlobal || '-'}/10`;
            if(d.veredicto === "POSITIVO") { clase = d.puntuacionGlobal >= 8.5 ? "int-3" : (d.puntuacionGlobal >= 7 ? "int-2" : "int-1"); } 
            else if (d.veredicto === "NEGATIVO") clase = "neg";
        }
        
        // Efecto especial para el día actual
        let isHoy = diaISO === hoyISOReal ? "dia-hoy" : "";
        grid.innerHTML += `<div class="dia-cal ${clase} ${isHoy}" title="${title}">${i}</div>`;
      }
    }
  </script>
