    <style>
      :root {
        --bg-color: #0b0c10; --panel-bg: #15171e; --accent: #00ff88; 
        --accent-2: #00b8ff; --accent-3: #ffb800;
        --text-main: #f0f4f8; --text-muted: #8b949e; --error: #ff4757; 
        --warning: #ffa502; --border: rgba(255,255,255,0.05);
      }
      body {
        font-family: 'Inter', 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text-main);
        margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
      }
      header {
        width: 100%; display: flex; justify-content: space-between; align-items: center;
        padding: 15px 40px; box-sizing: border-box; border-bottom: 1px solid var(--border);
        background: rgba(21, 23, 30, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;
      }
      nav { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
      .nav-btn { background: none; border: none; color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer; padding: 10px 15px; border-radius: 8px; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
      .nav-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .nav-btn:hover { color: white; background: rgba(255,255,255,0.05); }
      .nav-btn.activo { color: var(--accent); background: rgba(0, 255, 136, 0.1); }
      .saludo { text-align: right; line-height: 1.3; } .saludo strong { font-size: 18px; color: white; } .saludo span { font-size: 13px; color: var(--text-muted); }
      
      #pantalla-auth { display: flex; justify-content: center; align-items: center; height: 100vh; width: 100%; }
      #app-principal { display: none; width: 100%; flex-direction: column; align-items: center; }
      .pestana { display: none; width: 95%; max-width: 1100px; margin-top: 30px; flex-direction: column; gap: 20px; animation: fade 0.4s ease; padding-bottom: 50px;}
      .pestana.activa { display: flex; }
      @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

      .panel { background: var(--panel-bg); padding: 25px; border-radius: 16px; border: 1px solid var(--border); position: relative; }
      .panel h3 { margin-top: 0; font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
      .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
      .dash-grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
      @media(max-width: 800px) { .dash-grid-2 { grid-template-columns: 1fr; } .saludo {display:none;} }
      .numero-gigante { font-size: 42px; font-weight: 900; color: white; margin: 5px 0; }
      .texto-pequeno { font-size: 13px; color: var(--text-muted); }
      .barra-progreso { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-top: 15px; overflow: hidden; }
      .progreso-fill { height: 100%; background: var(--accent); transition: width 0.5s; }

      .grafico-balance-container { position: relative; width: 150px; height: 150px; margin: 0 auto; }
      .balance-texto-centro { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
      .leyenda-balance { margin-top: 15px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
      
      .calendario-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
      .dia-cal { aspect-ratio: 1; border-radius: 4px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; font-size: 11px; color: #555; cursor: help; transition: 0.2s;}
      .dia-cal:hover { transform: scale(1.1); z-index: 10; box-shadow: 0 0 10px rgba(0,255,136,0.3); }
      .dia-cal.int-3 { background: var(--accent); color: #000; font-weight: bold; }
      .dia-cal.int-2 { background: rgba(0, 255, 136, 0.5); color: #fff; }
      .dia-cal.int-1 { background: rgba(0, 255, 136, 0.2); color: #fff; }
      .dia-cal.neg { background: var(--error); color: white; }

      textarea, input[type="text"] { background: rgba(0,0,0,0.2); color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; font-size: 16px; width: 100%; box-sizing: border-box; }
      textarea { min-height: 140px; resize: vertical; }
      textarea:focus, input:focus { outline: none; border-color: var(--accent); }
      
      button.btn-principal { background: var(--accent); color: #000; border: none; padding: 15px; font-size: 16px; font-weight: 800; border-radius: 12px; cursor: pointer; width: 100%; transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 10px; }
      button.btn-principal:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,255,136,0.3); }
      button.btn-principal:disabled { background: #333; color: #888; cursor: not-allowed; }

      #diario-zona-resultado { display: none; animation: fade 0.5s ease; flex-direction: column; gap: 15px; }
      .stats-ia-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
      .stat-ia-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border: 1px solid var(--border); display: flex; justify-content: space-between; font-weight: bold; }
      .stat-ia-box span { color: var(--accent); }
      .insight-box { background: rgba(0, 255, 136, 0.05); border-left: 4px solid var(--accent); padding: 15px; border-radius: 8px; font-style: italic; color: #ddd; line-height: 1.5; }

      .auth-card { background: var(--panel-bg); padding: 30px; border-radius: 16px; text-align: center; width: 90%; max-width: 400px; }
      .auth-card input { width: 100%; padding: 12px; margin-bottom: 10px; box-sizing: border-box; background: #000; color: white; border: 1px solid var(--border); border-radius: 8px; }
      .btn-auth { padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; transition: 0.2s;}
      
      .tarea-item { display:flex; justify-content:space-between; background:rgba(255,255,255,0.03); padding:15px; border-radius:10px; align-items:center; border: 1px solid var(--border); transition: 0.2s;}
      .tarea-item:hover { background: rgba(255,255,255,0.06); }
      .check-box { width:22px; height:22px; border-radius:6px; border:2px solid var(--accent); display:flex; align-items:center; justify-content:center; color:black; font-weight:bold; font-size:14px; transition: 0.2s; }
      
      .filtro-historial { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;}
      .btn-filtro { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--border); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: 0.2s; }
      .btn-filtro.activo { background: var(--accent); color: black; border-color: var(--accent); font-weight: bold; }
      
      .lista-historial { display: flex; flex-direction: column; gap: 15px; }
      .item-historial { background: var(--panel-bg); padding: 20px; border-left: 4px solid gray; border-radius: 12px; border: 1px solid var(--border); transition: 0.2s; }
      .item-historial:hover { transform: translateX(5px); border-color: rgba(255,255,255,0.1); }
      .item-historial.POSITIVO { border-left-color: var(--accent); }
      .item-historial.NEGATIVO { border-left-color: var(--error); }
      .item-historial.NEUTRO { border-left-color: var(--warning); }

  <script>
    // --- 1. PREVENCIÓN XSS (SANITIZADOR DOM) ---
    function esc(str) {
      if(!str) return "";
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    // --- 2. GESTIÓN DE TIEMPO ESTRICTA (ISO) ---
    const getHoyISO = () => new Date().toISOString().split('T')[0]; // Ej: "2026-08-23"
    
    // --- 3. FIREBASE CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyAfzGeUy1uI98YrDpFUrQbSWDN1ag9IrJA",
      authDomain: "diario-inteligente-d329b.firebaseapp.com",
      projectId: "diario-inteligente-d329b",
      storageBucket: "diario-inteligente-d329b.firebasestorage.app"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let usuarioActual = null; let chartDonut = null; let chartLine = null; 
    let misTareasDeHoy = []; let historialGlobal = []; 

    document.getElementById('fecha-diario').textContent = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
    function actualizarContador() { document.getElementById('contador-chars').textContent = `${document.getElementById('texto-diario').value.length} / 2.000 caracteres`; }
    function cambiarPestana(id, btn) { document.querySelectorAll('.pestana').forEach(p => p.classList.remove('activa')); document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('activo')); document.getElementById(id).classList.add('activa'); if(btn) btn.classList.add('activo'); }

    // --- AUTENTICACIÓN MEJORADA ---
    auth.onAuthStateChanged((user) => {
      if (user) { 
        usuarioActual = user; 
        document.getElementById('pantalla-auth').style.display = 'none'; 
        document.getElementById('app-principal').style.display = 'flex'; 
        let nombreDisplay = user.isAnonymous ? "Invitado" : (user.displayName ? user.displayName.split(' ')[0] : "Usuario");
        document.getElementById('nombre-usuario').textContent = esc(nombreDisplay);
        cargarDatosNube(); cargarTareasNube();
      } else { 
        usuarioActual = null; document.getElementById('app-principal').style.display = 'none'; document.getElementById('pantalla-auth').style.display = 'flex'; 
      }
    });

    const getEl = (id) => document.getElementById(id).value;
    const showErr = (msg) => document.getElementById('auth-error').textContent = msg;
    
    async function loginEmail() { try { await auth.signInWithEmailAndPassword(getEl('auth-email'), getEl('auth-password')); } catch (e) { showErr(e.message); } }
    async function registrarEmail() { try { await auth.createUserWithEmailAndPassword(getEl('auth-email'), getEl('auth-password')); } catch (e) { showErr(e.message); } }
    async function loginGoogle() { try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); } catch (e) { showErr(e.message); } }
    async function loginInvitado() { try { await auth.signInAnonymously(); } catch (e) { showErr(e.message); } }
    function cerrarSesion() { auth.signOut(); }

    // --- TAREAS VINCULADAS A LA FECHA ---
    async function cargarTareasNube() {
      if(!usuarioActual) return;
      const hoyISO = getHoyISO();
      // Solo pedimos las tareas que pertenezcan a HOY
      const snapshot = await db.collection('usuarios').doc(usuarioActual.uid).collection('tareas')
                               .where('fechaISO', '==', hoyISO).get();
      misTareasDeHoy = []; snapshot.forEach(doc => misTareasDeHoy.push({ id: doc.id, ...doc.data() }));
      renderTareas();
    }
    
    async function agregarTarea() {
      const input = document.getElementById('input-tarea'); const texto = input.value.trim(); if(!texto) return;
      const nueva = { texto, completada: false, fechaISO: getHoyISO(), timestamp: Date.now() };
      
      const docRef = await db.collection('usuarios').doc(usuarioActual.uid).collection('tareas').add(nueva);
      misTareasDeHoy.push({ id: docRef.id, ...nueva }); input.value = ""; renderTareas();
    }
    
    async function toggleTarea(id) {
      const tarea = misTareasDeHoy.find(t => t.id === id); if(!tarea) return;
      tarea.completada = !tarea.completada; renderTareas();
      await db.collection('usuarios').doc(usuarioActual.uid).collection('tareas').doc(id).update({ completada: tarea.completada });
    }
    
    async function eliminarTarea(id) {
      misTareasDeHoy = misTareasDeHoy.filter(t => t.id !== id); renderTareas();
      await db.collection('usuarios').doc(usuarioActual.uid).collection('tareas').doc(id).delete();
    }
    
    function renderTareas() {
      const lista = document.getElementById('lista-tareas'); lista.innerHTML = ""; let completadas = 0;
      misTareasDeHoy.forEach(t => {
        if(t.completada) completadas++;
        // PREVENCIÓN XSS EN TAREAS
        const txtSeguro = esc(t.texto);
        lista.innerHTML += `
          <div class="tarea-item">
            <div style="display:flex; gap:15px; align-items:center; cursor:pointer; flex:1;" onclick="toggleTarea('${t.id}')">
              <div class="check-box" style="background:${t.completada ? 'var(--accent)' : 'transparent'};">${t.completada ? '✓' : ''}</div>
              <span style="${t.completada ? 'text-decoration:line-through; color:gray;' : 'color:white;'}">${txtSeguro}</span>
            </div>
            <button onclick="eliminarTarea('${t.id}')" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:18px;">🗑️</button>
          </div>`;
      });
      const total = misTareasDeHoy.length;
      document.getElementById('tareas-completadas').textContent = `${completadas} / ${total}`;
      document.getElementById('tareas-completadas').style.color = (total > 0 && completadas === total) ? "var(--accent)" : "white";
      document.getElementById('barra-tareas').style.width = total === 0 ? "0%" : `${(completadas/total)*100}%`;
    }

    // --- CEREBRO IA (PREPARADO PARA BACKEND) ---
    async function analizarYGuardar() {
      const texto = document.getElementById('texto-diario').value;
      const btn = document.getElementById('btn-guardar');
      const errEl = document.getElementById('error-ia');
      if (!texto.trim()) return;

      btn.disabled = true; btn.innerHTML = "Cruzando datos..."; errEl.textContent = "";

      const tareasTXT = misTareasDeHoy.map(t => (t.completada ? '☑ ' : '☐ ') + t.texto).join('\n');
      const prompt = `Analiza la disciplina cruzando el diario CON la lista de tareas.
Tareas de hoy:
${tareasTXT || 'Ninguna tarea registrada.'}
Diario: "${texto}"
Devuelve ÚNICAMENTE un JSON válido: {"veredicto":"POSITIVO|NEGATIVO|NEUTRO","estado":"🟢 Sólido","disciplina":8,"enfoque":7,"constancia":9,"insight":"Frase corta"}`;

      try {
        // --------------------------------------------------------------------------------
        // 🔴 ZONA DE SEGURIDAD: Aquí es donde llamaremos al backend de Netlify luego.
        // fetch('/.netlify/functions/analizar', { ... })
        // Por ahora mantenemos la llamada directa para que pruebes que la UI funciona.
        // --------------------------------------------------------------------------------
     // Ahora llamamos a nuestro propio backend seguro
        const resp = await fetch('/.netlify/functions/analizar', {
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: prompt })
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error.message);

        let textoRaw = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
        const iaData = JSON.parse(textoRaw);
        const v = iaData.veredicto; if (!['POSITIVO','NEGATIVO','NEUTRO'].includes(v)) throw new Error("Veredicto inválido");
        
        const clamp = (num) => Math.min(Math.max(parseInt(num) || 5, 1), 10);
        const d = clamp(iaData.disciplina), e = clamp(iaData.enfoque), c = clamp(iaData.constancia);
        const globalScore = ((d + e + c) / 3).toFixed(1);
        
        const nuevaEntrada = {
          fechaISO: getHoyISO(), // Fecha matemática "2026-08-23"
          fechaDisplay: new Date().toLocaleDateString('es-ES', {day:'numeric', month:'short'}),
          timestamp: Date.now(), 
          veredicto: v, textoOriginal: texto, estado: iaData.estado || "⚪ Neutro",
          disciplina: d, enfoque: e, constancia: c, puntuacionGlobal: parseFloat(globalScore),
          insight: iaData.insight || "Sigue así."
        };

        await db.collection('usuarios').doc(usuarioActual.uid).collection('entradas').add(nuevaEntrada);

        // Actualizar UI
        document.getElementById('ia-estado').textContent = esc(iaData.estado);
        document.getElementById('ia-disciplina').textContent = d + '/10';
        document.getElementById('ia-enfoque').textContent = e + '/10';
        document.getElementById('ia-constancia').textContent = c + '/10';
        document.getElementById('ia-puntuacion-global').textContent = globalScore;
        document.getElementById('ia-insight').textContent = esc(iaData.insight);
        
        document.getElementById('diario-zona-input').style.display = 'none';
        document.getElementById('diario-zona-resultado').style.display = 'flex';
        document.getElementById('texto-diario').value = "";
        actualizarContador(); cargarDatosNube();

      } catch (err) { 
        errEl.textContent = "Error al conectar con la IA. Reintenta."; btn.disabled = false; btn.innerHTML = "🧠 Analizar y guardar";
      }
    }

    function irAlPanelDesdeResultado() {
        document.getElementById('diario-zona-resultado').style.display = 'none';
        document.getElementById('diario-zona-input').style.display = 'block';
        document.getElementById('btn-guardar').innerHTML = "🧠 Analizar y guardar entrada";
        document.getElementById('btn-guardar').disabled = false;
        cambiarPestana('panel', document.querySelectorAll('.nav-btn')[2]);
    }

    // --- CARGA GLOBAL Y LÓGICA TEMPORAL CORREGIDA ---
    async function cargarDatosNube() {
      if (!usuarioActual) return;
      const snapshot = await db.collection('usuarios').doc(usuarioActual.uid).collection('entradas').orderBy('timestamp', 'desc').get();
      historialGlobal = []; snapshot.forEach(doc => historialGlobal.push(doc.data()));

      renderHistorial(historialGlobal); 
      calcularRachasPorDiasReales(historialGlobal); 
      renderGraficaBalance(historialGlobal); 
      renderEvolucionEstricta7Dias(historialGlobal); 
      renderCalendario(historialGlobal);
    }

    function aplicarFiltro(tipo, btn) {
      document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('activo')); btn.classList.add('activo');
      if(tipo === 'ALL') renderHistorial(historialGlobal); else renderHistorial(historialGlobal.filter(d => d.veredicto === tipo));
    }

    function renderHistorial(entradas) {
      const cont = document.getElementById('lista-historial'); cont.innerHTML = "";
      if(entradas.length === 0) { cont.innerHTML = '<p class="texto-pequeno">No hay resultados.</p>'; return; }
      entradas.forEach(d => {
        let statsHtml = d.disciplina ? `<div class="hist-stats"><span>💪 Dis: ${d.disciplina}</span><span>🎯 Enf: ${d.enfoque}</span><span>⚡ Con: ${d.constancia}</span></div><div style="margin-top:10px; font-style:italic; color:#aaa; font-size:13px;">💡 ${esc(d.insight)}</div>` : '';
        let dot = d.veredicto === "POSITIVO" ? "🟢" : (d.veredicto === "NEGATIVO" ? "🔴" : "🟡");
        cont.innerHTML += `<div class="item-historial ${d.veredicto}">
          <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <div class="texto-pequeno" style="font-weight:bold; color:white;">${esc(d.fechaDisplay)} · ${dot}</div>
            <span style="background:rgba(255,255,255,0.1); padding:3px 8px; border-radius:4px; font-weight:bold; font-size:12px;">Nota: ${d.puntuacionGlobal || '-'}</span>
          </div>
          <div style="font-size:15px; line-height:1.6; color:#ccc;">"${esc(d.textoOriginal)}"</div>
          ${statsHtml}
        </div>`;
      });
    }

    // 🔴 REPARACIÓN DE LÓGICA DE RACHA (Días Consecutivos)
    function calcularRachasPorDiasReales(entradas) {
      // 1. Agrupar por fechas únicas y coger el mejor veredicto del día
      let mapaDias = {};
      entradas.forEach(e => {
        if (!mapaDias[e.fechaISO] || e.veredicto === 'POSITIVO') {
          mapaDias[e.fechaISO] = e.veredicto;
        }
      });
      
      // 2. Extraer fechas únicas ordenadas de más reciente a más antigua
      let fechasUnicas = Object.keys(mapaDias).sort((a,b) => new Date(b) - new Date(a));
      
      let rachaActual = 0;
      let hoy = getHoyISO();
      let ayer = new Date(); ayer.setDate(ayer.getDate() - 1);
      let ayerISO = ayer.toISOString().split('T')[0];

      // La racha vive si el último día positivo fue HOY o AYER
      let fechaAComprobar = fechasUnicas.includes(hoy) ? hoy : ayerISO;
      
      let refDate = new Date(fechaAComprobar);
      for(let f of fechasUnicas) {
         if (f === fechaAComprobar && mapaDias[f] === 'POSITIVO') {
             rachaActual++;
             // Bajar un día para la siguiente iteración
             refDate.setDate(refDate.getDate() - 1);
             fechaAComprobar = refDate.toISOString().split('T')[0];
         } else {
             break;
         }
      }

      const txt = rachaActual === 1 ? "1 día" : rachaActual + " días";
      document.getElementById('racha-numero').textContent = txt;
      document.getElementById('racha-numero').style.color = rachaActual > 0 ? "var(--accent)" : "var(--text-muted)";
      document.getElementById('racha-estado').textContent = rachaActual > 0 ? "🔥 Racha activa" : "Sin racha activa";
    }

    function renderGraficaBalance(entradas) {
      let pos = 0, neg = 0, neu = 0;
      entradas.forEach(d => { if(d.veredicto==="POSITIVO") pos++; else if(d.veredicto==="NEGATIVO") neg++; else neu++; });
      const total = pos + neg + neu; const pctPos = total === 0 ? 0 : Math.round((pos/total)*100);
      document.getElementById('balance-ganador').textContent = `${pctPos}%`;
      document.getElementById('leyenda-balance').innerHTML = `<div><span style="color:var(--accent)">●</span> Positivos — ${pos}</div><div><span style="color:var(--error)">●</span> Negativos — ${neg}</div><div><span style="color:var(--warning)">●</span> Neutros — ${neu}</div>`;
      if (chartDonut) chartDonut.destroy();
      chartDonut = new Chart(document.getElementById('miGrafica').getContext('2d'), { type: 'doughnut', data: { datasets: [{ data: [pos, neg, neu], backgroundColor: ['#00ff88', '#ff4757', '#ffa502'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '80%', plugins: { tooltip: { enabled: false } } } });
    }

    // 🔴 REPARACIÓN DE LÓGICA DE EVOLUCIÓN (7 Días Exactos)
    function renderEvolucionEstricta7Dias(entradas) {
      // Agrupamos la mejor entrada de cada día
      let mapaDias = {};
      entradas.forEach(e => {
        if(!mapaDias[e.fechaISO] || (e.puntuacionGlobal > mapaDias[e.fechaISO].puntuacionGlobal)) {
          mapaDias[e.fechaISO] = e;
        }
      });

      const labels = []; const dataD = []; const dataE = []; const dataC = [];
      const diasNombres = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

      // Generar los últimos 7 días del calendario
      for(let i=6; i>=0; i--) {
        let tempD = new Date(); tempD.setDate(tempD.getDate() - i);
        let iso = tempD.toISOString().split('T')[0];
        labels.push(diasNombres[tempD.getDay()]); // "Lun", "Mar"...
        
        if(mapaDias[iso]) {
          dataD.push(mapaDias[iso].disciplina); dataE.push(mapaDias[iso].enfoque); dataC.push(mapaDias[iso].constancia);
        } else {
          dataD.push(0); dataE.push(0); dataC.push(0); // Días vacíos a 0
        }
      }

      Chart.defaults.color = '#8b949e';
      if (chartLine) chartLine.destroy();
      chartLine = new Chart(document.getElementById('graficaEvolucion').getContext('2d'), {
        type: 'line', data: { 
          labels: labels, 
          datasets: [
            { label: 'Dis', data: dataD, borderColor: '#00ff88', borderWidth: 2, tension: 0.3 },
            { label: 'Enf', data: dataE, borderColor: '#00b8ff', borderWidth: 2, tension: 0.3 },
            { label: 'Con', data: dataC, borderColor: '#ffb800', borderWidth: 2, tension: 0.3 }
          ] 
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true, position: 'bottom'} }, scales: { y: { min: 0, max: 10, grid: { color: 'rgba(255,255,255,0.05)' } }, x: { grid: { display: false } } } }
      });
    }

    function renderCalendario(entradas) {
      const grid = document.getElementById('calendario-grid'); grid.innerHTML = "";
      let mapa = {}; entradas.forEach(d => { if(!mapa[d.fechaISO]) mapa[d.fechaISO] = d; });
      for(let i = 27; i >= 0; i--) {
        let tempD = new Date(); tempD.setDate(tempD.getDate() - i);
        let iso = tempD.toISOString().split('T')[0]; let num = tempD.getDate();
        
        let d = mapa[iso]; let clase = ""; let title = "Sin actividad";
        if(d) {
            title = `${d.fechaDisplay} | Nota: ${d.puntuacionGlobal || '-'}/10`;
            if(d.veredicto === "POSITIVO") { clase = d.puntuacionGlobal >= 8.5 ? "int-3" : (d.puntuacionGlobal >= 7 ? "int-2" : "int-1"); } 
            else if (d.veredicto === "NEGATIVO") clase = "neg";
        }
        grid.innerHTML += `<div class="dia-cal ${clase}" title="${title}">${num}</div>`;
      }
    }
  </script>
